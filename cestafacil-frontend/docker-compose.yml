version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: cestafacil-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cestafacil123
      MYSQL_DATABASE: cestafacil
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcestaFacil123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cestafacil-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cestafacil
      DB_USER: root
      DB_PASS: cestafacil123
      JWT_SECRET: cestafacil-jwt-secret-key-muito-segura-2026-spring-security
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: cestafacil-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
