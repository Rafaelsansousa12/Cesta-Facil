server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://cesta-facil.onrender.com/api/;
        proxy_set_header Host cesta-facil.onrender.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}